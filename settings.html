<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Settings · Admin · AppVerse</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
<link rel="stylesheet" href="../styles.css" />
<link rel="stylesheet" href="../admin.css" />
<script type="importmap">
{ "imports": {
  "firebase/app":"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js",
  "firebase/auth":"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js",
  "firebase/firestore":"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js",
  "firebase/functions":"https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js"
}}
</script>
</head>
<body class="admin-body">
<aside class="admin-sidebar" id="adminSidebar">
  <a class="brand" href="index.html"><span class="brand-mark"><i class="fa-solid fa-cube"></i></span><span class="brand-text">App<strong>Verse</strong></span></a>
  <span class="admin-badge">ADMIN</span>
  <nav class="admin-nav">
    <a class="admin-link" href="index.html"><i class="fa-solid fa-gauge-high"></i> Dashboard</a>
    <a class="admin-link" href="products.html"><i class="fa-solid fa-box"></i> Products</a>
    <a class="admin-link" href="orders.html"><i class="fa-solid fa-receipt"></i> Orders</a>
    <a class="admin-link" href="users.html"><i class="fa-solid fa-users"></i> Users</a>
    <a class="admin-link" href="categories.html"><i class="fa-solid fa-tags"></i> Categories</a>
    <a class="admin-link is-active" href="settings.html"><i class="fa-solid fa-gear"></i> Settings</a>
    <a class="admin-link admin-logout" href="#" id="adminLogout"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
  </nav>
  <div class="admin-user" id="adminUser"></div>
</aside>

<main class="admin-main">
  <header class="admin-topbar">
    <button class="icon-btn mobile-only" id="adminMenuToggle"><i class="fa-solid fa-bars"></i></button>
    <h1>Marketplace Settings</h1>
  </header>

  <section class="admin-content">
    <div class="panel">
      <header class="panel-head"><h2><i class="fa-solid fa-store"></i> Public storefront</h2></header>
      <div class="panel-body">
        <form id="settingsForm">
          <div class="field">
            <label for="sStoreName">Store name</label>
            <input id="sStoreName" maxlength="80" />
          </div>
          <div class="field">
            <label for="sContactEmail">Support email</label>
            <input id="sContactEmail" type="email" maxlength="120" />
          </div>
          <div class="field">
            <label for="sContactPhone">Support phone</label>
            <input id="sContactPhone" maxlength="30" />
          </div>
          <div class="field">
            <label for="sBkash">bKash number for payments</label>
            <input id="sBkash" maxlength="30" placeholder="01XXXXXXXXX" />
          </div>
          <div class="field">
            <label for="sNagad">Nagad number</label>
            <input id="sNagad" maxlength="30" />
          </div>
          <div class="field">
            <label for="sRocket">Rocket number</label>
            <input id="sRocket" maxlength="30" />
          </div>
          <div class="field">
            <label for="sTelegramChat">Telegram chat ID (used by Cloud Functions)</label>
            <input id="sTelegramChat" maxlength="40" value="-1004322135682" />
            <small class="hint">Bot token is configured as a Cloud Functions secret, not here.</small>
          </div>
          <button class="btn btn-primary" type="submit"><i class="fa-solid fa-floppy-disk"></i> Save settings</button>
        </form>
      </div>
    </div>
  </section>
</main>

<div class="toast-stack" id="toasts" role="status" aria-live="polite"></div>
<script type="module" src="../admin-settings.js"></script>
</body>
</html>
