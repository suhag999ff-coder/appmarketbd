<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin Panel · AppVerse</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body class="admin-body">

<!-- Sidebar -->
<aside class="admin-sidebar" id="adminSidebar">
  <a class="brand" href="index.html" style="margin-bottom: 20px;"><span class="brand-mark"><i class="fa-solid fa-cube"></i></span><span class="brand-text">App<strong>Verse</strong></span></a>
  <nav class="admin-nav">
    <button data-view="dashboard" class="active"><i class="fa-solid fa-gauge"></i> Dashboard</button>
    <button data-view="products"><i class="fa-solid fa-box"></i> Products</button>
    <button data-view="orders"><i class="fa-solid fa-receipt"></i> Orders</button>
    <button data-view="users"><i class="fa-solid fa-users"></i> Users</button>
    <button data-view="settings"><i class="fa-solid fa-gear"></i> Settings</button>
    <button id="adminLogout" style="color:var(--danger); margin-top:20px;"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
  </nav>
</aside>

<!-- Main Content -->
<div class="admin-main">
  <header class="admin-topbar">
    <button id="menuBtn" style="font-size:1.2rem;"><i class="fa-solid fa-bars"></i></button>
    <h2 id="pageTitle" style="font-size:1.1rem; flex:1;">Dashboard</h2>
  </header>

  <!-- Dashboard -->
  <section data-view="dashboard">
    <div class="stat-grid" id="statGrid"></div>
    <div class="panel"><div class="panel-head">Recent Orders</div><div id="recentOrders"></div></div>
  </section>

  <!-- Products (Hidden) -->
  <section data-view="products" hidden>
    <div class="panel">
      <div class="panel-head">All Products <button class="btn btn-primary" style="padding:6px 12px; font-size:0.8rem;" onclick="alert('Add Product Form')">+ Add New</button></div>
      <div id="adminProductsList"></div>
    </div>
  </section>

  <!-- Orders (Hidden) -->
  <section data-view="orders" hidden>
    <div class="panel"><div class="panel-head">All Orders</div><div id="adminOrdersList"></div></div>
  </section>

  <!-- Users (Hidden) -->
  <section data-view="users" hidden>
    <div class="panel"><div class="panel-head">Registered Users</div><div id="adminUsersList"></div></div>
  </section>

  <!-- Settings (Hidden) -->
  <section data-view="settings" hidden>
    <div class="panel">
      <div class="panel-head">Telegram & Store Settings</div>
      <div class="panel-body">
        <form id="settingsForm">
          <div class="field"><label>Telegram Bot Token</label><input id="tgToken"></div>
          <div class="field"><label>Telegram Chat ID</label><input id="tgChat"></div>
          <button class="btn btn-primary btn-block" type="submit">Save Settings</button>
        </form>
      </div>
    </div>
  </section>
</div>

<script type="module" src="admin.js"></script>
</body>
</html>
