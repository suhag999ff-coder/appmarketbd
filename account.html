<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Account · AppVerse</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body id="accountPage" style="padding-bottom: 80px;">

<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="index.html"><span class="brand-mark"><i class="fa-solid fa-cube"></i></span><span class="brand-text">App<strong>Verse</strong></span></a>
  </div>
</header>

<section class="section">
  <div class="balance-card">
    <h3>My Wallet Balance</h3>
    <div class="amount" id="accBalance">৳0</div>
  </div>

  <div style="text-align:center; margin-bottom: 24px;">
    <h2 id="accName" style="font-size:1.4rem; margin-bottom:4px;">Loading...</h2>
    <p id="accEmail" style="color:var(--muted); font-size:0.9rem;"></p>
  </div>

  <div class="panel">
    <div class="panel-head">Edit Profile</div>
    <div class="panel-body">
      <form id="profileForm">
        <div class="field"><label>Name</label><input id="editName"></div>
        <div class="field"><label>Phone</label><input id="editPhone" placeholder="01XXXXXXXXX"></div>
        <div class="field"><label>Address</label><textarea id="editAddress" rows="2"></textarea></div>
        <button class="btn btn-primary btn-block" type="submit"><i class="fa-solid fa-save"></i> Save Changes</button>
      </form>
    </div>
  </div>

  <button class="btn btn-block" id="logoutBtn" style="background:#fee2e2; color:#ef4444; margin-top:20px;"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
</section>

<nav class="bottom-nav">
  <a href="index.html"><i class="fa-solid fa-house"></i>Home</a>
  <a href="orders.html"><i class="fa-solid fa-receipt"></i>Orders</a>
  <a href="account.html" class="active"><i class="fa-solid fa-user"></i>Account</a>
</nav>

<script type="module" src="auth.js"></script>
</body>
</html>
