<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Orders · Admin · AppVerse</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
<link rel="stylesheet" href="../styles.css" />
<link rel="stylesheet" href="../admin.css" />
<script type="importmap">
{ "imports": {
  "firebase/app":"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js",
  "firebase/auth":"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js",
  "firebase/firestore":"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js",
  "firebase/functions":"https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js"
}}
</script>
</head>
<body class="admin-body">
<aside class="admin-sidebar" id="adminSidebar">
  <a class="brand" href="index.html"><span class="brand-mark"><i class="fa-solid fa-cube"></i></span><span class="brand-text">App<strong>Verse</strong></span></a>
  <span class="admin-badge">ADMIN</span>
  <nav class="admin-nav">
    <a class="admin-link" href="index.html"><i class="fa-solid fa-gauge-high"></i> Dashboard</a>
    <a class="admin-link" href="products.html"><i class="fa-solid fa-box"></i> Products</a>
    <a class="admin-link is-active" href="orders.html"><i class="fa-solid fa-receipt"></i> Orders</a>
    <a class="admin-link" href="users.html"><i class="fa-solid fa-users"></i> Users</a>
    <a class="admin-link" href="categories.html"><i class="fa-solid fa-tags"></i> Categories</a>
    <a class="admin-link" href="settings.html"><i class="fa-solid fa-gear"></i> Settings</a>
    <a class="admin-link admin-logout" href="#" id="adminLogout"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
  </nav>
  <div class="admin-user" id="adminUser"></div>
</aside>

<main class="admin-main">
  <header class="admin-topbar">
    <button class="icon-btn mobile-only" id="adminMenuToggle"><i class="fa-solid fa-bars"></i></button>
    <h1>Orders</h1>
    <div class="spacer"></div>
    <input id="adminOrderSearch" class="admin-input" type="search" placeholder="Search by name, phone, ID…" />
    <select id="adminOrderStatus" class="select">
      <option value="">All statuses</option>
      <option value="pending">Pending</option>
      <option value="confirmed">Confirmed</option>
      <option value="completed">Completed</option>
      <option value="cancelled">Cancelled</option>
    </select>
  </header>

  <section class="admin-content">
    <div class="admin-table-wrap">
      <table class="admin-table" id="ordersTable">
        <thead>
          <tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Payment</th><th>Status</th><th>Created</th><th></th></tr>
        </thead>
        <tbody id="ordersTbody">
          <tr><td colspan="8"><div class="skeleton-card" style="height:40px"></div></td></tr>
        </tbody>
      </table>
    </div>
    <div class="admin-cards" id="ordersCards"></div>
  </section>
</main>

<div class="modal" id="orderModal" hidden>
  <div class="modal-backdrop" data-close="orderModal"></div>
  <div class="modal-panel modal-lg">
    <button class="modal-close" type="button" data-close="orderModal"><i class="fa-solid fa-xmark"></i></button>
    <h3 class="modal-title"><i class="fa-solid fa-receipt"></i> Order details</h3>
    <div id="orderDetail"></div>
  </div>
</div>

<div class="toast-stack" id="toasts" role="status" aria-live="polite"></div>
<script type="module" src="../admin-orders.js"></script>
</body>
</html>
