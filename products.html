<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Products · Admin · AppVerse</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
<link rel="stylesheet" href="../styles.css" />
<link rel="stylesheet" href="../admin.css" />
<script type="importmap">
{ "imports": {
  "firebase/app":"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js",
  "firebase/auth":"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js",
  "firebase/firestore":"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js",
  "firebase/functions":"https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js"
}}
</script>
</head>
<body class="admin-body">
<aside class="admin-sidebar" id="adminSidebar">
  <a class="brand" href="index.html"><span class="brand-mark"><i class="fa-solid fa-cube"></i></span><span class="brand-text">App<strong>Verse</strong></span></a>
  <span class="admin-badge">ADMIN</span>
  <nav class="admin-nav">
    <a class="admin-link" href="index.html"><i class="fa-solid fa-gauge-high"></i> Dashboard</a>
    <a class="admin-link is-active" href="products.html"><i class="fa-solid fa-box"></i> Products</a>
    <a class="admin-link" href="orders.html"><i class="fa-solid fa-receipt"></i> Orders</a>
    <a class="admin-link" href="users.html"><i class="fa-solid fa-users"></i> Users</a>
    <a class="admin-link" href="categories.html"><i class="fa-solid fa-tags"></i> Categories</a>
    <a class="admin-link" href="settings.html"><i class="fa-solid fa-gear"></i> Settings</a>
    <a class="admin-link admin-logout" href="#" id="adminLogout"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
  </nav>
  <div class="admin-user" id="adminUser"></div>
</aside>

<main class="admin-main">
  <header class="admin-topbar">
    <button class="icon-btn mobile-only" id="adminMenuToggle"><i class="fa-solid fa-bars"></i></button>
    <h1>Products</h1>
    <div class="spacer"></div>
    <input id="adminProductSearch" class="admin-input" type="search" placeholder="Search products…" />
    <button class="btn btn-primary" id="newProductBtn"><i class="fa-solid fa-plus"></i> New product</button>
  </header>

  <section class="admin-content">
    <div class="admin-table-wrap">
      <table class="admin-table" id="productsTable">
        <thead>
          <tr>
            <th>Product</th><th>Category</th><th>Price</th><th>Featured</th><th>Available</th><th>Updated</th><th></th>
          </tr>
        </thead>
        <tbody id="productsTbody">
          <tr><td colspan="7"><div class="skeleton-card" style="height:40px"></div></td></tr>
        </tbody>
      </table>
    </div>
    <div class="admin-cards" id="productsCards"></div>
  </section>
</main>

<!-- Product editor modal -->
<div class="modal" id="productModal" hidden>
  <div class="modal-backdrop" data-close="productModal"></div>
  <div class="modal-panel modal-lg">
    <button class="modal-close" type="button" data-close="productModal" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
    <h3 class="modal-title" id="productModalTitle"><i class="fa-solid fa-box"></i> New product</h3>
    <form id="productForm" novalidate>
      <input type="hidden" id="pId" />
      <div class="grid-2">
        <div class="field">
          <label for="pName">Name <span class="req">*</span></label>
          <input id="pName" required maxlength="200" />
          <small class="error" data-error-for="pName"></small>
        </div>
        <div class="field">
          <label for="pCategory">Category <span class="req">*</span></label>
          <select id="pCategory" class="select" required><option value="">Loading…</option></select>
        </div>
      </div>
      <div class="field">
        <label for="pDescription">Description <span class="req">*</span></label>
        <textarea id="pDescription" rows="4" required maxlength="4000"></textarea>
      </div>
      <div class="grid-2">
        <div class="field">
          <label for="pImageUrl">Main image URL <span class="req">*</span></label>
          <input id="pImageUrl" type="url" placeholder="https://…" required />
          <small class="error" data-error-for="pImageUrl"></small>
        </div>
        <div class="field">
          <label for="pVersion">Version</label>
          <input id="pVersion" maxlength="30" placeholder="e.g. 4.2.1" />
        </div>
      </div>
      <div class="field">
        <label for="pScreenshots">Additional screenshot URLs (one per line, max 12)</label>
        <textarea id="pScreenshots" rows="3" placeholder="https://…&#10;https://…"></textarea>
      </div>
      <div class="grid-3">
        <div class="field">
          <label for="pPrice">Price (৳) <span class="req">*</span></label>
          <input id="pPrice" type="number" min="0" step="0.01" required />
        </div>
        <div class="field">
          <label for="pOriginalPrice">Original price (৳)</label>
          <input id="pOriginalPrice" type="number" min="0" step="0.01" />
        </div>
        <div class="field">
          <label for="pProductUrl">Product / download URL</label>
          <input id="pProductUrl" type="url" placeholder="https://…" />
        </div>
      </div>
      <div class="row">
        <label class="switch"><input type="checkbox" id="pFeatured" /><span></span> Featured</label>
        <label class="switch"><input type="checkbox" id="pAvailable" checked /><span></span> Available</label>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" type="button" data-close="productModal">Cancel</button>
        <button class="btn btn-primary" type="submit" id="saveProductBtn"><i class="fa-solid fa-floppy-disk"></i> Save</button>
      </div>
    </form>
  </div>
</div>

<div class="modal" id="confirmModal" hidden>
  <div class="modal-backdrop" data-close="confirmModal"></div>
  <div class="modal-panel modal-sm">
    <h3 id="confirmTitle" class="modal-title">Are you sure?</h3>
    <p id="confirmMessage" class="muted"></p>
    <div class="modal-actions">
      <button class="btn btn-ghost" type="button" id="confirmCancel">Cancel</button>
      <button class="btn btn-danger" type="button" id="confirmOk">Confirm</button>
    </div>
  </div>
</div>

<div class="toast-stack" id="toasts" role="status" aria-live="polite"></div>
<script type="module" src="../admin-products.js"></script>
</body>
</html>
